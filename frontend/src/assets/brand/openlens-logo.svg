<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ol-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ol-gradient-light" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (scaled down slightly to match text height) -->
  <g transform="translate(10, 20) scale(0.66)">
    <path d="M60 15 L100 35 L100 85 L60 105 L20 85 L20 35 Z" fill="none" stroke="url(#ol-gradient)" stroke-width="8" stroke-linejoin="round" />
    <circle cx="60" cy="60" r="16" fill="url(#ol-gradient-light)" />
    <path d="M35 60 A 25 25 0 0 1 85 60" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M85 60 A 25 25 0 0 1 35 60" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <text x="110" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="48" fill="#0F172A" letter-spacing="-1">
    Open<tspan fill="url(#ol-gradient)">Lens</tspan>
  </text>
</svg>
