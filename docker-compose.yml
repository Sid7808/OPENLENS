# OpenLens Services Docker Compose
# PostgreSQL service prepared for upcoming architecture plan execution
services:
  postgres:
    image: postgres:16-alpine
    container_name: openlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-openlens_core}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlens -d openlens_core"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
